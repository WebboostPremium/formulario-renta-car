<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Personalización — Rent a Car</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { font-family: 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen py-10 px-4">

  <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
    
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-8 text-white text-center">
      <h1 class="text-3xl font-bold mb-2">🚗 Configuración de tu Sitio Web</h1>
      <p class="text-blue-100 text-sm">Por favor, completa los siguientes datos para personalizar tu plataforma de Rent a Car.</p>
    </div>

    <form id="customForm" class="p-8 space-y-8">
      
      <div class="space-y-4">
        <h2 class="text-xl font-bold text-gray-700 pb-2 border-b border-gray-200">1. Datos Principales del Negocio</h2>
        
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Nombre Oficial del Rent a Car</label>
          <input type="text" id="nombre_negocio" placeholder="Ej: Valdez Renta A Car" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Breve Descripción del Negocio (Opcional)</label>
          <textarea id="descripcion" rows="3" placeholder="Un párrafo corto sobre quiénes son o su compromiso con el cliente..." class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Ubicación Principal (Ciudad y País)</label>
            <input type="text" id="ubicacion" placeholder="Ej: San Salvador, El Salvador" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Año de Fundación</label>
            <input type="number" id="fundacion" placeholder="Ej: 2026" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Link o cómo aparece en Google Maps (Opcional)</label>
          <input type="text" id="maps_link" placeholder="Ej: Valdez Rent A Car, Alameda Roosevelt o el enlace de Maps" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
        </div>
      </div>

      <div class="space-y-4">
        <h2 class="text-xl font-bold text-gray-700 pb-2 border-b border-gray-200">2. Canales de Contacto y Alertas</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Número de WhatsApp (Sin espacios ni "+")</label>
            <input type="tel" id="whatsapp" placeholder="Ej: 77777777" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <p class="text-[11px] text-gray-400 mt-1">.</p>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Correo </label>
            <input type="email" id="email_notificaciones" placeholder="ejemplo@correo.com" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
          </div>
        </div>
      </div>

      <div class="space-y-4">
        <div class="flex justify-between items-center pb-2 border-b border-gray-200">
          <h2 class="text-xl font-bold text-gray-700">3. Flota de Vehículos</h2>
          <button type="button" id="addVehicleBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition-all cursor-pointer">
            ➕ Añadir Vehículo
          </button>
        </div>

        <div id="vehiclesContainer" class="space-y-6">
          
          <div class="vehicle-block bg-gray-50 p-5 rounded-xl border border-gray-200 relative space-y-4">
            <div class="flex justify-between items-center">
              <span class="text-sm font-bold text-blue-600 tracking-wide uppercase vehicle-title">Vehículo #1</span>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Nombre / Modelo</label>
                <input type="text" required placeholder="Ej: Toyota Corolla 2023" class="car-name w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Categoría / Tipo</label>
                <select required class="car-type w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="Económico">Económico</option>
                  <option value="Sedán">Sedán</option>
                  <option value="SUV">SUV</option>
                  <option value="Pick-up">Pick-up</option>
                  <option value="Familiar">Familiar</option>
                  <option value="4x4">4x4</option>
                </select>
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Precio por Día ($)</label>
                <input type="number" required placeholder="Ej: 35" class="car-price w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div>
                <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Transmisión</label>
                <select required class="car-trans w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="Automático">Automático</option>
                  <option value="Mecánico">Mecánico</option>
                </select>
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Combustible</label>
                <select required class="car-fuel w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="Gasolina">Gasolina</option>
                  <option value="Diésel">Diésel</option>
                </select>
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Pasajeros</label>
                <input type="number" required placeholder="Ej: 5" class="car-passengers w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">¿Aire Acondicionado?</label>
                <select required class="car-ac w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="Sí">Sí</option>
                  <option value="No">No</option>
                </select>
              </div>
            </div>
          </div>

        </div>
      </div>

      <div class="pt-4 border-t border-gray-200">
        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5 active:translate-y-0 cursor-pointer flex justify-center items-center gap-2">
          <span>💾 Enviar A webbooost</span>
        </button>
      </div>

    </form>
  </div>

  <script>
    const TG_TOKEN   = '8237099777:AAGIzOIWxYyR37fZQKjBSGUBUQak6pOn24Q';
    const TG_CHAT_ID = '5257502158';

    const container = document.getElementById('vehiclesContainer');
    const addBtn = document.getElementById('addVehicleBtn');
    let vehicleCount = 1;

    addBtn.addEventListener('click', () => {
      vehicleCount++;
      const newBlock = document.createElement('div');
      newBlock.className = "vehicle-block bg-gray-50 p-5 rounded-xl border border-gray-200 relative space-y-4 shadow-sm";
      newBlock.innerHTML = `
        <div class="flex justify-between items-center">
          <span class="text-sm font-bold text-blue-600 tracking-wide uppercase vehicle-title">Vehículo #${vehicleCount}</span>
          <button type="button" class="remove-btn text-red-500 hover:text-red-700 text-xs font-semibold flex items-center gap-0.5 cursor-pointer">
            ❌ Eliminar
          </button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Nombre / Modelo</label>
            <input type="text" required placeholder="Ej: Toyota Corolla 2023" class="car-name w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Categoría / Tipo</label>
            <select required class="car-type w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="Económico">Económico</option>
              <option value="Sedán">Sedán</option>
              <option value="SUV">SUV</option>
              <option value="Pick-up">Pick-up</option>
              <option value="Familiar">Familiar</option>
              <option value="4x4">4x4</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Precio por Día ($)</label>
            <input type="number" required placeholder="Ej: 35" class="car-price w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Transmisión</label>
            <select required class="car-trans w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="Automático">Automático</option>
              <option value="Mecánico">Mecánico</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Combustible</label>
            <select required class="car-fuel w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="Gasolina">Gasolina</option>
              <option value="Diésel">Diésel</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Pasajeros</label>
            <input type="number" required placeholder="Ej: 5" class="car-passengers w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">¿Aire Acondicionado?</label>
            <select required class="car-ac w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="Sí">Sí</option>
              <option value="No">No</option>
            </select>
          </div>
        </div>
      `;
      container.appendChild(newBlock);

      newBlock.querySelector('.remove-btn').addEventListener('click', () => {
        newBlock.remove();
        reorderVehicleTitles();
      });
    });

    function reorderVehicleTitles() {
      const blocks = container.querySelectorAll('.vehicle-block');
      vehicleCount = blocks.length;
      blocks.forEach((block, index) => {
        block.querySelector('.vehicle-title').textContent = `Vehículo #${index + 1}`;
      });
    }

    document.getElementById('customForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Enviando información...';

      // Recopilar datos generales
      const negocio = document.getElementById('nombre_negocio').value;
      const descripcion = document.getElementById('descripcion').value || 'No especificado';
      const ubicacion = document.getElementById('ubicacion').value;
      const fundacion = document.getElementById('fundacion').value;
      const maps = document.getElementById('maps_link').value || 'No especificado';
      const whatsapp = document.getElementById('whatsapp').value;
      const email = document.getElementById('email_notificaciones').value;

      // Recopilar la lista de vehículos dinámicos
      let textoVehiculos = '';
      const blocks = container.querySelectorAll('.vehicle-block');
      blocks.forEach((block, index) => {
        const name = block.querySelector('.car-name').value;
        const type = block.querySelector('.car-type').value;
        const price = block.querySelector('.car-price').value;
        const trans = block.querySelector('.car-trans').value;
        const fuel = block.querySelector('.car-fuel').value;
        const pass = block.querySelector('.car-passengers').value;
        const ac = block.querySelector('.car-ac').value;

        textoVehiculos += `🚗 *VEHÍCULO #${index + 1}*\n` +
                          `• *Modelo:* ${name}\n` +
                          `• *Tipo:* ${type}\n` +
                          `• *Precio:* $${price}/día\n` +
                          `• *Transmisión:* ${trans}\n` +
                          `• *Combustible:* ${fuel}\n` +
                          `• *Pasajeros:* ${pass}\n` +
                          `• *A/C:* ${ac}\n\n`;
      });

      // Armar mensaje final formateado en Markdown para Telegram
      const mensajeTelegram = `📂 *NUEVA WEB CONFIGURADA*\n` +
                              `=========================\n\n` +
                              `🏪 *NEGOCIO:* ${negocio}\n` +
                              `📝 *DESCRIPCIÓN:* ${descripcion}\n` +
                              `📍 *UBICACIÓN:* ${ubicacion}\n` +
                              `📅 *FUNDACIÓN:* ${fundacion}\n` +
                              `🗺️ *MAPS:* ${maps}\n\n` +
                              `📞 *WHATSAPP:* \`${whatsapp}\`\n` +
                              `✉️ *EMAIL:* ${email}\n\n` +
                              `=========================\n\n` +
                              `${textoVehiculos}`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TG_CHAT_ID,
            text: mensajeTelegram,
            parse_mode: 'Markdown'
          })
        });

        if (response.ok) {
          alert('¡Listo! Toda la información de personalización ha sido enviada con éxito a tu chat de Telegram.');
          document.getElementById('customForm').reset();
          container.innerHTML = ''; 
          addBtn.click();
        } else {
          alert('Error al enviar los datos a Telegram. Revisa la consola o conexión.');
        }
      } catch (error) {
        console.error(error);
        alert('Hubo un problema de red al intentar conectar con Telegram.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '💾 Enviar A webbooost';
      }
    });
  </script>
</body>
</html>
